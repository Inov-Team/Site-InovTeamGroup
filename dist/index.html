/*
VOICE  : ESN agile, sûre d'elle, chaleureuse.
IDEA   : la maquette validée par Inov Team, reproduite fidèlement.
PICTURE: la main aux fils de lumière, en haut à droite.
COLOUR and TYPE: lavande très clair, encre #1b1446, violet #7b3fe4 et dégradé de charte, marine #141a4a ; League Spartan et Capriola.
LAYOUT : contenu 1200 px, bandeaux pleine largeur pour les entités, le CTA et le pied de page.
*/
:root{--g:max(24px,calc((100vw - var(--max)) / 2));--ink:#1b1446;--muted:#4c4868;--violet:#7b3fe4;--line:#e7e3f3;--soft:#f7f5fd;--navy:#141a4a;
--eo:cubic-bezier(.23,1,.32,1);--eio:cubic-bezier(.77,0,.175,1);--grad:linear-gradient(95deg,#6a3df0,#9b3fd8 55%,#d23aa8);--tgrad:linear-gradient(95deg,#7b2ff0,#c935a6);--max:1200px}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0;color:var(--muted)}
.wrap{width:min(var(--max),100% - 48px);margin-inline:auto}
.g{background:var(--tgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:flex;align-items:center;gap:14px;font:700 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.eyebrow.line::after{content:"";width:36px;height:2px;background:var(--violet)}
:focus-visible{outline:3px solid #9b7bff;outline-offset:3px;border-radius:8px}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 26px;border-radius:999px;border:0;background:var(--grad);color:#fff;font:700 16px "Plus Jakarta Sans",sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 10px 26px rgba(123,63,228,.28);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(123,63,228,.36)}
.btn.out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.out-v{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px #c9bdf0}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.15)}
.btn svg{flex:none}

/* header */
.hd{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.hd.sc{border-color:var(--line)}
.hd .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand img{height:62px;width:auto}
.nav{display:flex;align-items:center;gap:clamp(18px,2.6vw,38px);font:600 15px "Plus Jakarta Sans",sans-serif}
.nav>a,.dd>button{color:var(--ink);background:none;border:0;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 0}
.nav>a:hover,.dd>button:hover{color:var(--violet)}
.dd{position:relative}
.menu{position:absolute;top:100%;left:-18px;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 20px 50px rgba(27,20,70,.12)}
.menu a{display:block;padding:10px 12px;border-radius:10px;font:600 15px "Plus Jakarta Sans",sans-serif}
.menu a small{display:block;font:13px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.menu a:hover{background:var(--soft);color:var(--violet)}
.burger{display:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.mnav{overflow:hidden;border-top:1px solid var(--line);background:#fff}
.mnav nav{display:flex;flex-direction:column;padding:12px 24px 24px;font:600 19px "Plus Jakarta Sans",sans-serif}
.mnav a{padding:11px 0}.mnav .btn{margin-top:12px;align-self:flex-start}
@media (max-width:1020px){.hd .nav,.hd .cta{display:none}.burger{display:inline-flex;align-items:center;justify-content:center}}
@media (min-width:1021px){.mnav{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(90deg,#fff 0,#f8f6fd 40%,#f1edfb 100%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;align-items:center;padding:44px 0 20px;min-height:520px}
.hero h1{font-size:clamp(38px,4.3vw,58px);line-height:1.08;margin:20px 0 20px;font-weight:800;letter-spacing:-.03em}
.hero .lead{font-size:clamp(17px,1.5vw,19px);color:var(--ink);max-width:540px;line-height:1.55}
.hero .acts{display:flex;flex-wrap:wrap;gap:16px;margin-top:34px}
.play{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}
.word{display:inline-block;white-space:pre}
.visual{position:relative;align-self:stretch;min-height:440px}
.visual .hand{position:absolute;top:-44px;right:calc(-1 * var(--g));width:calc(100% + var(--g) + 8%);height:auto;max-width:none}
.since{position:absolute;right:0;bottom:56px;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #e6defa;border-radius:16px;padding:18px 22px;box-shadow:0 18px 40px rgba(60,30,140,.14);z-index:3}
.since b{display:block;font:700 19px "Plus Jakarta Sans",sans-serif}
.since span{font-size:14px;color:var(--muted);line-height:1.35;display:block}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:26px 0 40px}
.stat{display:flex;gap:14px;align-items:flex-start;padding:0 22px}
.stat:first-child{padding-left:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:700 30px/1 "Plus Jakarta Sans",sans-serif}
.stat span{display:block;font-size:14px;color:var(--ink);margin-top:4px}
.stat small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.ico{flex:none;width:34px;height:34px;color:var(--violet)}
@media (max-width:980px){.hero-grid{grid-template-columns:minmax(0,1fr)}.visual{order:-1;min-height:340px}.since{bottom:10px;right:8px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px}.stat{padding:0 12px}.stat:nth-child(odd){padding-left:0;border-left:0}.stat:last-child{grid-column:1/-1}}

/* sections */
.sec{padding:72px 0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.head h2{font-size:clamp(30px,3vw,40px);line-height:1.08;margin-top:14px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{position:relative;display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px;min-height:120px;box-shadow:0 6px 20px rgba(27,20,70,.04);transition:border-color .25s,box-shadow .25s,transform .25s}
.card:hover,.card.on{border-color:#b89cf5;box-shadow:0 14px 34px rgba(123,63,228,.14);transform:translateY(-3px)}
.card.on{background:linear-gradient(160deg,#fff 40%,#f5efff)}
.card .ico{width:42px;height:42px}
.card h3{font-size:19px;line-height:1.15;font-weight:700}
.card p{font-size:13px;margin-top:8px;line-height:1.45}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}}

/* entités */
.ent{position:relative;overflow:hidden;margin:20px max(16px,calc((100vw - 1260px)/2));border-radius:28px;background:linear-gradient(110deg,#151a52 0,#1e1d6e 55%,#3b2aa8 100%);color:#fff;padding:40px 40px}
.ent .beams{position:absolute;inset:0;pointer-events:none;opacity:.9}
.ent-in{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:28px;align-items:center}
.ent .eyebrow{color:#cfc8ff}
.ent h2{font-size:clamp(26px,2.4vw,32px);line-height:1.1;margin-top:14px;font-weight:800}
.ent .rule{display:block;width:44px;height:3px;border-radius:2px;background:#c95ff0;margin-top:22px}
.ent-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ecard{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.94);color:var(--ink);border-radius:14px;padding:20px 18px;position:relative;min-height:96px;transition:transform .25s,box-shadow .25s}
.ecard:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,0,0,.25)}
.ecard b{display:block;font:700 18px "Plus Jakarta Sans",sans-serif}
.ecard b em{font-style:normal;color:var(--violet)}
.ecard span{font-size:13px;color:var(--muted)}
.ecard .arr{position:absolute;right:16px;bottom:14px;color:var(--violet)}
.ecard img{width:34px;height:34px;object-fit:contain}
@media (max-width:980px){.ent-in{grid-template-columns:minmax(0,1fr)}.ent{padding:32px 22px}}
@media (max-width:640px){.ent-cards{grid-template-columns:minmax(0,1fr)}}

/* clients */
.clients{padding:40px 0 10px}
.logos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;border-block:1px solid var(--line);padding:26px 0;margin-top:18px}
.logos img{max-height:36px;max-width:150px;width:auto}
.logos img.sq{max-height:50px}
@media (max-width:700px){.logos{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:26px}}

/* valeurs */
.vals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr);gap:36px;align-items:center}
.vals h2{font-size:clamp(30px,3vw,40px);line-height:1.08;margin:14px 0 16px;font-weight:800}
.vals p{max-width:440px}
.vcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.vcard{text-align:center;border:1px solid var(--line);border-radius:16px;padding:24px 14px;background:#fff;transition:transform .25s,box-shadow .25s}
.vcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(123,63,228,.12)}
.vcard .ico{margin:0 auto 12px;width:44px;height:44px}
.vcard h3{font-size:18px}
.vcard p{font-size:13px;margin-top:6px;line-height:1.4}
@media (max-width:980px){.vals{grid-template-columns:minmax(0,1fr)}.vcards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* carrières */
.car{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);border-radius:24px;overflow:hidden;background:linear-gradient(120deg,#fff,#f6f1ff);border:1px solid var(--line)}
.ph{min-height:300px;background:url(assets/equipe-commerciale.webp) 50% 50%/cover no-repeat}
.car-in{padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:center}
.car h2{font-size:clamp(26px,2.4vw,32px);line-height:1.15;margin:14px 0 14px;font-weight:800}
.car .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.car .row p{max-width:420px}
@media (max-width:860px){.car{grid-template-columns:minmax(0,1fr)}.ph{min-height:220px}}

/* bandeau CTA */
.band{margin-top:28px;background:linear-gradient(100deg,#3a1d8f 0,#6b2fd6 45%,#b23bc9 100%);color:#fff;position:relative;overflow:hidden}
.band .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding:38px 0}
.band h2{font-size:clamp(26px,2.4vw,34px);line-height:1.12;font-weight:800}
.band h2 span{color:#f3a6ff}

/* footer */
.ft{background:#141a4a;color:#fff;padding:52px 0 28px}
.ft-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.4fr;gap:32px}
.ft img{height:60px;width:auto}
.ft .tag{margin-top:14px;font:600 14px "Plus Jakarta Sans",sans-serif;letter-spacing:.06em;color:#fff}
.ft h4{margin:0 0 10px;font:700 15px "Plus Jakarta Sans",sans-serif}
.ft ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:#c4c1e0}
.ft ul a:hover{color:#fff}
.ft li{display:flex;gap:8px;align-items:center}
.ft .bot{margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:#9a97c2}
@media (max-width:900px){.ft-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ft-grid>div:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (min-width:981px){.hero h1 .nw{white-space:nowrap}}
.hero h1 .word.nw,.hero h1 .nw .word{white-space:pre}

.band .beams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band .wrap{position:relative}

/* responsive fin */
.logos img{max-width:min(150px,100%)}
@media (min-width:1600px){:root{--max:1320px}.hero h1{font-size:64px}.visual{min-height:520px}}
@media (min-width:2200px){:root{--max:1440px}html{font-size:18px}body{font-size:17px}}
@media (max-width:980px){.hero-grid{padding-top:8px}.visual{min-height:clamp(260px,62vw,420px)}}
@media (max-width:600px){
 .wrap{width:min(var(--max),100% - 32px)}
 .hero h1{font-size:clamp(32px,9.6vw,44px)}
 .hero .acts .btn{width:100%;justify-content:center}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 0}
 .stat{flex-direction:column;gap:8px;padding:0 0 0 14px}
 .stat:nth-child(odd){padding-left:0}
 .stat b{font-size:26px}
 .since{padding:12px 14px;gap:10px}.since b{font-size:16px}.since span{font-size:12px}.since .ico{width:30px;height:30px}
 .head .btn{width:100%;justify-content:center}
 .logos{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}
 .logos img{max-height:28px}.logos img.sq{max-height:40px}
 .vcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .vcard{padding:18px 10px}.vcard h3{font-size:16px}
 .ent{margin-inline:12px;border-radius:22px;padding:28px 18px}
 .band .wrap{padding:32px 0}.band .btn{white-space:normal;width:100%;justify-content:center;text-align:center}
 .car .row .btn{width:100%;justify-content:center}
 .eyebrow{letter-spacing:.22em}
}
@media (max-width:480px){.ft-grid{grid-template-columns:minmax(0,1fr)}.brand img{height:50px}}
@media (max-width:360px){.eyebrow.line::after{display:none}.vcards{grid-template-columns:minmax(0,1fr)}}
.ent{margin-inline:max(16px,calc((100vw - var(--max) - 60px) / 2))}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:26px}.stat:nth-child(4){padding-left:0;border-left:0}.ent-in{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.logos{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:26px;column-gap:20px}}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(4){padding-left:14px}.stat:nth-child(odd){padding-left:0}.logos{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (max-width:980px){.visual .hand{top:-8px;width:calc(100% + var(--g));}}
@media (max-width:600px){:root{--g:16px}}

/* galerie équipe */
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(170px,17vw,240px);gap:14px}
.gi{position:relative;border-radius:18px;overflow:hidden;background:var(--soft)}
.g-team{grid-column:span 2;grid-row:span 2}.g-com{grid-column:span 2}.g-ev{grid-column:span 2}.g-c{grid-column:span 2}
.gbtn{all:unset;display:block;width:100%;height:100%;cursor:zoom-in;position:relative}
.gbtn:focus-visible{outline:3px solid #9b7bff;outline-offset:-3px}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.gi:hover img{transform:scale(1.05)}
.cap{position:absolute;left:12px;bottom:12px;right:12px;width:max-content;max-width:calc(100% - 24px);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);color:var(--ink);font:600 13px "Plus Jakarta Sans",sans-serif;padding:7px 12px;border-radius:999px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(15,12,45,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:zoom-out}
.lb img{max-width:min(1100px,100%);max-height:80vh;border-radius:14px;object-fit:contain}
.lb p{color:#fff;font-weight:600}
.lbx{position:absolute;top:18px;right:18px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:26px;cursor:pointer}
@media (max-width:760px){.gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:170px;gap:10px}.g-team{grid-column:1/-1;grid-row:span 2}.g-com,.g-ev,.g-c{grid-column:1/-1}}

/* une section = un écran */
.screen{min-height:calc(100svh - 84px);display:flex;flex-direction:column;justify-content:center}
.hero.screen>.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;width:min(var(--max),100% - 48px)}
.hero.screen .hero-grid{flex:1;min-height:0}
.sec.screen{padding:56px 0}
.ent-screen{padding:24px 0}
.ent-screen .ent{margin-block:0}
#confiance .clients{padding-top:24px}
#confiance .sec{padding:56px 0 40px}
.car-screen{padding:40px 0}
.end-screen{justify-content:flex-end}
.end-screen .band{flex:1;display:flex;align-items:center;margin-top:0}
.end-screen .band .wrap{width:min(var(--max),100% - 48px)}
@media (max-width:600px){.hero.screen>.wrap,.end-screen .band .wrap{width:calc(100% - 32px)}}
@media (max-height:560px){.screen{min-height:0}}
.ent-screen{padding:24px 0}
.ent-screen .ent{flex:1;display:flex;align-items:center;padding:clamp(32px,5vw,72px)}
.ent-screen .ent-in{width:100%}
.ent-screen .ent h2{font-size:clamp(30px,3.4vw,50px)}
.ent-screen .ecard{min-height:clamp(110px,22svh,200px);flex-direction:column;padding:26px 22px}
.ent-screen .ecard b{font-size:clamp(18px,1.6vw,22px)}
.car-screen .car{min-height:min(680px,calc(100svh - 84px - 80px))}
.car-screen .ph{min-height:260px}
#expertises .card{min-height:clamp(120px,calc((100svh - 84px - 320px) / 2),220px)}
.gal{grid-auto-rows:clamp(150px,calc((100svh - 84px - 280px) / 3),240px)}
@media (max-width:760px){.gal{grid-auto-rows:170px}.car-screen .car{min-height:0}}
@media (max-width:1000px){#expertises .card{min-height:0}.ent-screen .ecard{min-height:0}}
@media (min-width:981px){
 .hero.screen .hero-grid,.hero .visual{position:static}
 .hero .visual .hand{top:0;right:0;left:auto;width:min(76vw,1500px);height:100%;max-width:none;object-fit:cover;object-position:22% 30%;z-index:0}
 .hero-grid>div:first-child,.stats{position:relative;z-index:2}
 .hero .since{right:var(--g);bottom:clamp(170px,24svh,240px)}
 .hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (min-width:981px){
 .hero .visual .hand{width:min(66vw,1300px);object-position:12% 30%}
 .hero.screen::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#f8f6fd 0,rgba(248,246,253,.92) 30%,rgba(248,246,253,0) 52%),linear-gradient(0deg,#f5f2fc 0,rgba(245,242,252,.85) 18%,rgba(245,242,252,0) 34%)}
 .hero .since{z-index:3}
}
@media (max-width:980px){.visual{min-height:clamp(320px,88vw,560px)}.visual .hand{width:calc(100% + var(--g) + 12%);top:-16px}}
@media (min-width:981px){
 .hero .visual .hand{width:min(58vw,1150px);height:calc(100% - 150px);top:10px;object-fit:contain;object-position:right center}
 .hero.screen::before{background:linear-gradient(90deg,#f8f6fd 0,rgba(248,246,253,.85) 32%,rgba(248,246,253,0) 48%)}
}
@media (min-width:981px){.hero .visual .hand{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%);mask-image:linear-gradient(180deg,transparent 0,#000 16%)}}
@media (min-width:981px){.hero .visual .hand{height:auto;top:50%;transform:translateY(calc(-50% - 70px));object-fit:fill;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24%);mask-image:linear-gradient(180deg,transparent 0,#000 24%)}}
@media (min-width:981px){.hero .visual .hand{transform:none;margin-top:calc(min(58vw,1150px) * -0.308 - 70px)}}
/* visuel d'origine en panneau */
.hero .visual .hand{position:absolute!important;inset:0!important;top:0!important;right:0!important;margin:0!important;transform:none!important;width:100%!important;height:100%!important;max-width:none;object-fit:cover!important;object-position:45% 50%!important;border-radius:28px;-webkit-mask-image:none!important;mask-image:none!important;box-shadow:0 30px 70px rgba(30,20,120,.28)}
.hero.screen::before{display:none}
@media (min-width:981px){.hero .visual{position:relative!important;align-self:center;height:min(560px,calc(100svh - 84px - 230px));min-height:360px}.hero .since{right:-18px;bottom:28px}}
@media (max-width:980px){.visual{min-height:0;aspect-ratio:650/438;margin-top:12px}.hero .since{right:10px;bottom:-18px}}
@media (min-width:981px){.hero .visual{height:auto;min-height:0;aspect-ratio:650/438;max-height:calc(100svh - 84px - 230px)}.hero-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px}}
@media (min-width:981px){.hero h1{font-size:clamp(34px,3.4vw,52px)!important}}

/* pages internes */
a.card{color:inherit}
.phero{background:linear-gradient(90deg,#fff 0,#f8f6fd 45%,#f1edfb 100%);padding:clamp(56px,9svh,110px) 0 clamp(48px,7svh,80px);min-height:calc(52svh - 84px);display:flex;align-items:center}
.phero .wrap{width:min(var(--max),100% - 48px)}
.crumb{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);margin-bottom:22px}
.crumb a{color:var(--violet);font-weight:600}
.phero h1{font-size:clamp(36px,5vw,64px);line-height:1.04;font-weight:800;letter-spacing:-.03em;max-width:900px}
.plead{margin-top:20px;font-size:clamp(17px,1.5vw,20px);max-width:680px;color:var(--ink)}
.pacts{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.psec{padding:clamp(56px,8vw,96px) 0}.psec.soft{background:var(--soft)}
.psec h2{font-size:clamp(26px,2.6vw,36px);font-weight:800;line-height:1.1;margin-bottom:28px}
.pgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:32px 56px;align-items:start}
.pgrid h2{margin-bottom:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plist li{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;font-weight:600;color:var(--ink)}
.plist .ico{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:#fff;border:1px solid #ddd3f6;border-radius:999px;padding:10px 16px;font-weight:600;color:var(--ink);font-size:15px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tri>div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
.tri h3{font-size:20px;margin-bottom:8px}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.olist a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-weight:700;color:var(--ink);transition:border-color .2s,transform .2s,box-shadow .2s;flex-wrap:wrap}
.olist a small{flex-basis:100%;font-weight:400;color:var(--muted);font-size:13px}
.olist a:hover{border-color:#b89cf5;transform:translateY(-2px);box-shadow:0 10px 26px rgba(123,63,228,.12)}
.olist .arr{margin-left:auto;color:var(--violet)}
.olist .ico{width:26px;height:26px}
.rits{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.rits>div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.rits h3{font-size:20px;margin-bottom:8px}
.empty{border:1.5px dashed #d6ccf2;border-radius:20px;padding:48px;text-align:center}
.empty h3{font-size:22px;margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:32px 56px;align-items:start}
.sites2{display:grid;gap:0}
.sites2 div{padding:18px 0;border-top:1px solid var(--line)}
.sites2 b{display:block;font-size:18px}.sites2 span{color:var(--muted)}
.form2{display:grid;gap:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,36px)}
.fld2{display:flex;flex-direction:column;gap:7px;font-weight:600;font-size:15px}
.fld2 input,.fld2 select,.fld2 textarea{font:16px "Plus Jakarta Sans",sans-serif;color:var(--ink);border:1px solid #ddd8ec;border-radius:12px;padding:14px 16px;min-height:50px;background:#fff}
.fld2 textarea{resize:vertical;min-height:130px}
.fld2 :focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(123,63,228,.15)}
.fld2[data-err=true] input,.fld2[data-err=true] textarea,.fld2[data-err=true] select{border-color:#d1243c}
.err2{color:#b3122b;font-weight:400;font-size:13px}
.form2 .btn{justify-self:start}
.sent2{background:var(--soft);border-left:3px solid var(--violet);border-radius:10px;padding:16px 18px;color:var(--ink)}
.steps2{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.steps2 li{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.steps2 span{flex:none;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700}
.steps2 h3{font-size:18px;margin-bottom:6px}
@media (max-width:900px){.pgrid,.cgrid{grid-template-columns:minmax(0,1fr)}.tri{grid-template-columns:minmax(0,1fr)}.steps2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.plist,.steps2{grid-template-columns:minmax(0,1fr)}.phero .wrap{width:calc(100% - 32px)}.form2 .btn{width:100%;justify-content:center}}
.olist a{flex-wrap:nowrap}.olist a:has(small){flex-wrap:wrap}
/* logos officiels */
.brand img{height:58px}
.ft img{height:74px}
.ecard{flex-direction:column;align-items:flex-start;gap:12px;background:#fff}
.ecard img.elg{width:auto;height:auto;max-width:min(190px,100%);max-height:96px;object-fit:contain}
.ent-screen .ecard{justify-content:space-between}
.plogo{height:clamp(80px,10vw,130px);width:auto;margin-bottom:18px}
.olist a.elogo{flex-direction:column;align-items:flex-start;gap:8px}
.olist a.elogo img{height:70px;width:auto}
@media (max-width:600px){.brand img{height:50px}}
.brand img{height:66px}.ent-screen .ecard img.elg{max-width:100%;max-height:130px}.ent-screen .ecard{padding:24px 22px}
/* explorateur d'expertises */
.hsub{margin-top:14px;max-width:560px}
.xp{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:28px;align-items:stretch}
.xp-list{display:flex;flex-direction:column;gap:4px}
.xp-tab{position:relative;isolation:isolate;display:flex;align-items:center;gap:16px;border:0;background:none;text-align:left;cursor:pointer;padding:15px 18px;border-radius:14px;color:var(--muted);font:600 clamp(16px,1.35vw,19px) "Plus Jakarta Sans",sans-serif;min-height:52px;overflow:hidden;transition:color .2s}
.xp-tab .ico{width:26px;height:26px;color:#b3a7d6;transition:color .2s}
.xp-tab:hover,.xp-tab[aria-selected=true]{color:var(--ink)}
.xp-tab[aria-selected=true] .ico{color:var(--violet)}
.xp-hl{position:absolute;inset:0;z-index:-1;border-radius:14px;background:#fff;border:1px solid #e3dbf7;box-shadow:0 10px 28px rgba(123,63,228,.12)}
.xp-prog{position:absolute;left:18px;right:18px;bottom:7px;height:2px;border-radius:2px;background:var(--grad);transform-origin:0 50%}
.xp-panel{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(150deg,#1b1a63 0,#2a1f8c 55%,#5a2bc0 100%);color:#fff;min-height:440px}
.xp-panel::before{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(201,53,166,.45),transparent 65%);pointer-events:none}
.xp-panel::after{content:"";position:absolute;left:-80px;bottom:-140px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(0,68,255,.4),transparent 65%);pointer-events:none}
.xp-in{position:relative;z-index:1;padding:clamp(28px,3.4vw,46px);height:100%;display:flex;flex-direction:column}
.xp-ico{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#e3d4ff;margin-bottom:22px}
.xp-ico .ico{width:44px;height:44px;color:#e3d4ff}
.xp-in h3{font-size:clamp(28px,2.8vw,40px);font-weight:800;color:#fff;letter-spacing:-.02em}
.xp-sum{margin-top:12px;color:#dcd6ff;font-size:clamp(16px,1.3vw,18px);max-width:560px}
.xp-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14)}
.xp-cols h4{margin:0 0 10px;font:700 14px "Plus Jakarta Sans",sans-serif;color:#f0a8ff}
.xp-cols ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.xp-cols li{display:flex;gap:10px;align-items:baseline;color:#fff;font-size:15px}
.xp-cols li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#c98bff;transform:translateY(-2px)}
.xp-chips{display:flex;flex-wrap:wrap;gap:8px}
.xp-chips span{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:13px;color:#fff;background:rgba(255,255,255,.06)}
.xp-acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto;padding-top:28px}
.xp-acts .btn.out-v{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
@media (max-width:900px){
 .xp{grid-template-columns:minmax(0,1fr);gap:16px}
 .xp-list{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-inline:-24px;padding:4px 24px 8px;scrollbar-width:none}
 .xp-tab{flex:none;scroll-snap-align:start;border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:46px;font-size:15px;white-space:nowrap}
 .xp-hl{border-radius:999px}.xp-prog{display:none}
 .xp-panel{min-height:0}.xp-cols{grid-template-columns:minmax(0,1fr)}
 .xp-acts .btn{width:100%;justify-content:center}
}
#expertises .head{margin-bottom:24px}
#expertises .head h2{font-size:clamp(28px,2.6vw,38px)}
.xp-tab{padding:11px 16px;min-height:46px}
.xp-in{padding:clamp(24px,2.6vw,36px)}
.xp-ico{width:56px;height:56px;border-radius:16px;margin-bottom:14px}.xp-ico .ico{width:34px;height:34px}
.xp-in h3{font-size:clamp(26px,2.4vw,34px)}
.xp-cols{margin-top:18px;padding-top:16px}
.xp-acts{padding-top:20px}
.xp-panel{min-height:0}
@media (max-width:600px){.xp-list{margin-inline:-16px;padding-inline:16px}}
/* roue des expertises */
.xp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:36px}
.xp-list{display:none}
.wheel-wrap{position:relative;perspective:1100px}
.wheel{width:100%;max-width:min(560px,calc(100svh - 300px));margin:0 auto;transform-style:preserve-3d}
.wheel svg{display:block;width:100%;height:auto;overflow:visible}
.wray{cursor:pointer;outline:none}
.wray:focus-visible rect{stroke:#7b3fe4;stroke-width:3}
.whint{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:13px;color:var(--muted)}
.xp-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.xp-top .xp-ico{margin:0}
.xp-bar{flex:1;height:2px;background:linear-gradient(90deg,#c98bff,#ff8ad8);transform-origin:0 50%;border-radius:2px;opacity:.8}
@media (max-width:900px){.wheel-wrap{display:none}.xp-list{display:flex}.xp{grid-template-columns:minmax(0,1fr)}}
@media (min-width:901px){.xp{gap:64px}.wheel{max-width:min(520px,calc(100svh - 320px))}}
/* main détourée */
.hero .visual .hand{object-fit:contain!important;object-position:center!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 0 1.5px #7b3fe4) drop-shadow(0 0 1.5px #7b3fe4) drop-shadow(0 0 10px rgba(155,107,255,.75)) drop-shadow(0 0 26px rgba(201,53,166,.35)) drop-shadow(0 28px 40px rgba(60,40,200,.22))}
@media (min-width:981px){.hero .visual{aspect-ratio:1300/871;max-height:calc(100svh - 84px - 200px)}.hero .visual .hand{inset:-6% -8% -4% -6%!important;width:114%!important;height:110%!important}.hero .since{right:0;bottom:6%}}
@media (max-width:980px){.visual{aspect-ratio:1300/871}}
@media (min-width:981px){.hero-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}.hero .visual .hand{inset:-8% -10% -2% -4%!important;width:114%!important;height:110%!important}}
@media (min-width:981px){.hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hero .visual .hand{inset:-16% -16% -6% -10%!important;width:126%!important;height:122%!important}}

/* ===== animations & correctifs ===== */
.hd{will-change:transform}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#2b4bff,#7b3fe4,#c935a6);transform-origin:0 50%}
.hand-wrap{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 1.5px #7b3fe4) drop-shadow(0 0 1.5px #7b3fe4) drop-shadow(0 0 10px rgba(155,107,255,.75)) drop-shadow(0 0 26px rgba(201,53,166,.35)) drop-shadow(0 28px 40px rgba(60,40,200,.22))}
.hero .visual .hand-wrap .hand{filter:none}
/* défilé logos */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding:26px 0;margin-top:18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;width:max-content;animation:mq 32s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-set{display:flex;align-items:center;gap:clamp(48px,7vw,110px);padding-right:clamp(48px,7vw,110px)}
.mq-set img{height:auto;max-height:34px;max-width:160px;width:auto;filter:grayscale(1);opacity:.65;transition:filter .3s,opacity .3s}
.mq-set img.sq{max-height:48px}
.mq-set img:hover{filter:none;opacity:1}
@keyframes mq{to{transform:translateX(-50%)}}
/* cartes entités */
.ecard{transform-style:preserve-3d;will-change:transform}
.ecard .arr{transition:transform .25s}.ecard:hover .arr{transform:translateX(5px)}
.ent{position:relative}
.ent::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(185,140,255,.22),transparent 60%);opacity:0;transition:opacity .3s}
.ent:hover::after{opacity:1}
.ent>*{position:relative;z-index:1}
/* boutons */
.btn{position:relative;overflow:hidden}
.btn svg{transition:transform .25s ease}
.btn:hover svg{transform:translateX(4px)}
.btn:not(.out):not(.out-v):not(.white)::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s ease}
.btn:not(.out):not(.out-v):not(.white):hover::after{left:120%}
/* cartes et liens */
.card,.olist a,.tri>div,.rits>div,.plist li,.steps2 li{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.tri>div:hover,.rits>div:hover,.plist li:hover,.steps2 li:hover{transform:translateY(-4px);border-color:#c9b6f7;box-shadow:0 14px 30px rgba(123,63,228,.12)}
.ft a{transition:color .2s}
.menu a{transition:background .15s,color .15s,padding-left .2s}.menu a:hover{padding-left:16px}
/* haut de page */
.totop{position:fixed;right:22px;bottom:22px;z-index:45;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6a3df0,#c935a6);box-shadow:0 12px 28px rgba(123,63,228,.35);display:grid;place-items:center}
.totop svg{transform:rotate(-90deg)}
/* correctifs mobile */
@media (max-width:700px){.ent-screen .ecard img.elg{max-height:72px;max-width:70%}.ent-screen .ecard{padding:18px}.hero .since{bottom:-10px}.totop{right:14px;bottom:14px;width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){.mq-track{animation:none}.btn::after{display:none}}


/* ===== finitions : courbes, survol au doigt, accessibilité ===== */
/* Les durées suivent l'échelle : survol 160 ms, menus 180 ms, cartes 240 ms. */
.btn{transition:transform .16s var(--eo),box-shadow .16s var(--eo)}
.card,.vcard,.olist a,.tri>div,.rits>div,.plist li,.steps2 li{transition:transform .24s var(--eo),box-shadow .24s var(--eo),border-color .24s var(--eo)}
.gi img{transition:transform .5s var(--eo)}
.menu a{transition:background .15s var(--eo),color .15s var(--eo),padding-left .18s var(--eo)}
.menu{transform-origin:top left}

/* Le survol est une intention de souris : au doigt, il reste collé après le tap. */
@media (hover:none),(pointer:coarse){
 .btn:hover,.card:hover,.vcard:hover,.ecard:hover,.olist a:hover,.tri>div:hover,.rits>div:hover,.plist li:hover,.steps2 li:hover{transform:none;box-shadow:0 6px 20px rgba(27,20,70,.04)}
 .btn::after{display:none}
 .gi:hover img{transform:none}
 .mq-set img{filter:none;opacity:1}
}

/* Lien d'évitement : premier élément focalisable de la page. */
.skip{position:fixed;top:10px;left:10px;z-index:100;transform:translateY(-200%);background:#fff;color:var(--ink);font-weight:700;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(27,20,70,.2);transition:transform .18s var(--eo)}
.skip:focus{transform:none}
main:focus{outline:none}

/* Contrôle du défilement automatique de la roue (WCAG 2.2.2). */
.whint{position:absolute;left:0;right:0;bottom:-10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.wpause{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}
.wpause:hover{border-color:#b89cf5;color:var(--violet)}

/* Cibles tactiles : 44 px au doigt, partout où on clique. */
@media (pointer:coarse){
 .ft ul a,.menu a,.mnav a,.bot a{display:inline-flex;align-items:center;min-height:44px}
 .ft li{min-height:44px}
}

/* Mouvement réduit : on garde les fondus, on enlève les déplacements. */
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
 .mq-track{animation:none;transform:none}
 .marquee{-webkit-mask-image:none;mask-image:none;overflow-x:auto}
}
